unbind r
bind r source-file ~/.tmux.conf

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g prefix C-s
set -g mouse on
set -g escape-time 50
set -g status on
set -g set-titles on
set -g set-titles-string "#T"
set -g status-interval 1
set -g history-limit 1000
set -g focus-events on
set -g message-limit 0
set -g assume-paste-time 0
# set -g default-terminal "screen-256color"
set -s set-clipboard on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
set-option -g status-keys vi

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# interfers with catppuccin
# set -g status-left '%H:%M:%S'

# List of plugins
# Plugins are installed to ~/.tmux/plugins/
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

set -g automatic-rename off
set -g allow-rename off

# set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "rounded" # rounded might be a better option but idgaf

set -g @catppuccin_window_default_text "#{b:pane_current_path}" # Use window name
set -g @catppuccin_window_current_text "#{b:pane_current_path}" # Use window name
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_number_position "left"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "

# For Mocha flavor
set -g @catppuccin_status_background "#1e1e2e"

# Add a leading space before #W
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left ""
set -g status-right ""
set -g status-right-length 100
set -g status-left-length 100

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
